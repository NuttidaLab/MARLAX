name: Deploy Sphinx documentation to Pages

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # This workflow contains a single job called "pages"
  pages:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Environment variables
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      pages: write
      id-token: write
    
    steps:
      # use the latest version of the checkout action
      - id: deployment
        uses: sphinx-notes/pages@v3
        with:
          documentation_path: '.'  # Path to Sphinx source files
          python_version: '3.12'  # Version of Python
          sphinx_version: '5.3'  # Version of Sphinx
          cache: true  # Enable cache to speed up documentation building
        
# Set concurrency group to avoid multiple builds
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true